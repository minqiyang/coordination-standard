<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
<title id="t">Task flow</title>
<desc id="d">A card with a goal and one lane goes to a worker. The worker runs a dev loop. It edits, runs, and reads results as often as it needs, and the dev loop has no gate. At a checkpoint, the worker reports to the coordinator and the coordinator replies. At the use point, the code is frozen as a commit SHA and goes through deterministic QA. The lane then sets the review: a coordinator check for ROUTINE, one seat for ELEVATED, and two seats for CRITICAL. The coordinator accepts the exact SHA, and the SHA goes to its use, such as a run of record or a merge. A QA failure, or a MATERIAL finding that survives triage, sends the work back to the dev loop. The repair makes a new SHA, which gets new QA and a new review. A legend shows a hollow dot for the coordinator check and a filled dot for a seat.</desc>
<style>
  svg{--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--accent:#D97757;--paper:#ffffff}
  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .k{font-size:11px;letter-spacing:.08em;fill:var(--mute)}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;fill:var(--mute)}
  .m{font-size:13px;font-weight:700}
  .w{fill:var(--paper);font-size:13px;font-weight:700}
  .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .ink{fill:none;stroke:var(--ink);stroke-width:1.5}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .fa{fill:var(--accent)} .fi{fill:var(--ink)} .fm{fill:var(--mute)} .fp{fill:var(--paper)}
</style>
<defs>
  <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fa"/></marker>
  <marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fm"/></marker>
  <marker id="ai" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fi"/></marker>
</defs>
<!-- track -->
<g style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round">
<path d="M50,130 H540"/>
<path d="M540,130 C565,130 565,90 590,90 H750 C775,90 775,130 800,130"/>
<path d="M540,130 H800"/>
<path d="M540,130 C565,130 565,170 590,170 H750 C775,170 775,130 800,130"/>
<path d="M800,130 H930"/>
</g>
<!-- dev loop, checkpoint, coordinator -->
<path d="M169,123 C145,78 209,78 185,123" class="acc" marker-end="url(#aa)"/>
<path d="M177,82 L184,89 L177,96 L170,89 Z" class="box" style="stroke-width:1.5"/>
<text x="198" y="93" class="s">checkpoint</text>
<text x="177" y="36" text-anchor="middle" class="m">Coordinator</text>
<path d="M172,82 V46" class="dash" marker-end="url(#am)"/>
<path d="M182,46 V82" class="dash" marker-end="url(#am)"/>
<!-- nodes -->
<g class="box" style="stroke-width:2.5">
<circle cx="50" cy="130" r="7"/><circle cx="177" cy="130" r="7"/><circle cx="303" cy="130" r="7"/>
<circle cx="430" cy="130" r="7"/>
<circle cx="830" cy="130" r="8"/>
</g>
<circle cx="930" cy="130" r="9" class="fi"/>
<g text-anchor="middle">
<text x="50" y="158" class="t">Card</text><text x="50" y="176" class="s">goal · lane</text>
<text x="177" y="158" class="t">Dev loop</text><text x="177" y="176" class="s">edit · run · read</text>
<text x="303" y="158" class="t">Freeze</text><text x="303" y="176" class="s">at use point</text>
<text x="430" y="158" class="t">QA</text><text x="430" y="176" class="s">deterministic</text>
<text x="670" y="204" class="t">Review</text>
<text x="830" y="158" class="t">Accept</text><text x="830" y="176" class="s">exact SHA</text>
<text x="930" y="158" class="t">Use</text><text x="930" y="176" class="s">run · merge</text>
</g>
<!-- review by lane -->
<text x="600" y="80" class="k">ROUTINE</text><text x="600" y="120" class="k">ELEVATED</text><text x="600" y="160" class="k">CRITICAL</text>
<circle cx="705" cy="90" r="5.5" class="fp" style="stroke:var(--accent);stroke-width:2"/>
<circle cx="705" cy="130" r="5.5" class="fa"/>
<circle cx="693" cy="170" r="5.5" class="fa"/><circle cx="717" cy="170" r="5.5" class="fa"/>
<!-- repair -->
<path d="M430,186 V232 M775,160 V232" class="dash"/>
<path d="M775,232 H177 V188" class="dash" marker-end="url(#am)"/>
<text x="303" y="224" text-anchor="middle" class="s">repair → new SHA</text>
<!-- legend -->
<circle cx="706" cy="266" r="5" class="fp" style="stroke:var(--accent);stroke-width:2"/><text x="718" y="270" class="s">coordinator check</text>
<circle cx="876" cy="266" r="5" class="fa"/><text x="888" y="270" class="s">seat</text>
</svg>
