<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 280" width="1060" height="280" role="img" aria-labelledby="t d">
<title id="t">Task lifecycle</title>
<desc id="d">A card is dispatched to a new Herdr Tab and git worktree. The coordinator waits in the background on herdr agent prompt with the wait flag, reads the report, and runs QA at the frozen commit. The lane then decides review: a coordinator check for Routine, a REVIEW seat for Elevated, AUDIT and AUDIT_2 for Critical. The exact candidate is accepted and merged by an authorized squash merge. QA failures and open findings loop back as a repair with a new candidate.</desc>
<style>
  svg{--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--accent:#D97757;--paper:#ffffff}
  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .k{font-size:11px;letter-spacing:.08em;fill:var(--mute)}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;fill:var(--mute)}
  .m{font-size:13px;font-weight:700}
  .w{fill:var(--paper);font-size:13px;font-weight:700}
  .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .ink{fill:none;stroke:var(--ink);stroke-width:1.5}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .fa{fill:var(--accent)} .fi{fill:var(--ink)} .fm{fill:var(--mute)} .fp{fill:var(--paper)}
</style>
<defs>
  <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fa"/></marker>
  <marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fm"/></marker>
  <marker id="ai" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fi"/></marker>
</defs>
<g style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round">
<path d="M50,100 H530"/>
<path d="M570,100 C605,100 605,60 640,60 H820 C855,60 855,100 890,100"/>
<path d="M530,100 H890"/>
<path d="M570,100 C605,100 605,140 640,140 H820 C855,140 855,100 890,100"/>
<path d="M890,100 H1000"/>
</g>
<path d="M284,92 C266,62 314,62 296,92" class="acc" marker-end="url(#aa)"/>
<g class="box" style="stroke-width:2.5">
<circle cx="50" cy="100" r="7"/><circle cx="170" cy="100" r="7"/><circle cx="290" cy="100" r="7"/>
<circle cx="410" cy="100" r="7"/><circle cx="530" cy="100" r="7"/>
<circle cx="890" cy="100" r="8" style="stroke:var(--accent)"/>
</g>
<circle cx="1000" cy="100" r="9" class="fi"/>
<g text-anchor="middle">
<text x="50" y="128" class="t">Card</text><text x="50" y="146" class="s">one lane</text>
<text x="170" y="128" class="t">New Tab</text><text x="170" y="146" class="s">+ worktree</text>
<text x="290" y="128" class="t">Wait</text><text x="290" y="146" class="s">background</text>
<text x="410" y="128" class="t">Report</text><text x="410" y="146" class="s">read · verify</text>
<text x="530" y="128" class="t">QA</text><text x="530" y="146" class="s">frozen SHA</text>
<text x="890" y="128" class="t">Accept</text><text x="890" y="146" class="s">exact SHA</text>
<text x="1000" y="128" class="t">Merge</text><text x="1000" y="146" class="s">authorized</text>
</g>
<text x="640" y="46" class="k">ROUTINE</text><text x="705" y="46" class="s">coordinator check</text>
<text x="640" y="86" class="k">ELEVATED</text><text x="715" y="86" class="s">REVIEW</text>
<text x="640" y="126" class="k">CRITICAL</text><text x="710" y="126" class="s">AUDIT + AUDIT_2</text>
<circle cx="790" cy="60" r="5.5" class="fp" style="stroke:var(--accent);stroke-width:2"/>
<circle cx="790" cy="100" r="5.5" class="fa"/>
<circle cx="778" cy="140" r="5.5" class="fa"/><circle cx="802" cy="140" r="5.5" class="fa"/>
<path d="M530,156 V222 M820,148 V222" class="dash"/>
<path d="M820,222 H50 V158" class="dash" marker-end="url(#am)"/>
<text x="290" y="212" text-anchor="middle" class="s">QA fails or finding open → repair → new candidate</text>
<text x="50" y="262" class="s">herdr agent prompt --wait runs as a background task; its exit wakes the coordinator.</text>
</svg>
