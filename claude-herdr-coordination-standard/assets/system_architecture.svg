<path d="M250,296 C312,296 332,230 358,204" class="dash" marker-end="url(#am)"/>

<text x="40" y="356" class="s">one worktree per worker · seats read-only at the frozen SHA</text>
<text x="40" y="376" class="s">workers run in Tabs of a separate Herdr session · a headless seat (such as codex exec) has no Tab</text>
