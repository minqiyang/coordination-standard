<path d="M629,268 H655 M629,277 H655 M629,286 H646" class="ln"/>
<text x="684" y="274" class="t">&lt;coord&gt;/</text>
<text x="684" y="292" class="s">tasks.md · cards · reports · QA</text>
<path d="M620,277 H400 V224" class="dash" marker-end="url(#am)"/>
<text x="510" y="268" text-anchor="middle" class="s">read · verify</text>

<rect x="40" y="256" width="210" height="44" rx="4" class="box" style="stroke-dasharray:4 3"/>
<text x="58" y="276" class="t">Subagents</text><text x="58" y="294" class="s">read-only · re-review</text>
<path d="M250,278 C312,278 332,230 358,204" class="dash" marker-end="url(#am)"/>

<text x="40" y="340" class="s">Producers write on task branches. Seats are fresh and read-only, detached at the frozen SHA.</text>
</svg>
