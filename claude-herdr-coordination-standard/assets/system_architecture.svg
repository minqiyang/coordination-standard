<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d">
<title id="t">System overview</title>
<desc id="d">Portable rules and replaceable model bindings feed a Claude Code coordinator that runs in its own Herdr Tab. It dispatches cards by route. Producers (GENERAL_EXEC, EXPERT), the AUDIT_2 seat, and the ADJUDICATOR each run in a new Tab in the separate workers Herdr session, which stays out of the owner's sidebar. With the default bindings, the REVIEW and AUDIT seats run headless, as background tasks of the coordinator with no Tab. Each worker has its own git worktree, and the harness in a seat's binding decides Tab or headless. Producers write on task branches. Seats are fresh and read-only, on a detached worktree at the frozen SHA. The report of every worker, in a Tab or headless, goes into the coord directory outside the repository, which also holds tasks.md, cards, QA logs, runs of record, and the worktrees. The coordinator reads and verifies them before it accepts the exact commit. Subagents are read-only helpers; one may also fill a seat for a re-review after a small repair.</desc>
