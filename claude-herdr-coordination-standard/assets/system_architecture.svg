<path d="M458,160 C530,160 530,200 594,200" class="acc" marker-end="url(#aa)"/>

<text x="600" y="62" class="k">WORKERS SESSION · TAB + WORKTREE EACH</text>
<g>
<rect x="600" y="80" width="300" height="40" rx="4" class="box"/><circle cx="616" cy="100" r="3.5" class="fa"/><text x="630" y="105" class="t">Producers</text><text x="886" y="104" text-anchor="end" class="s">GENERAL_EXEC · EXPERT</text>
<rect x="600" y="130" width="300" height="40" rx="4" class="box"/><circle cx="616" cy="150" r="3.5" class="fa"/><text x="630" y="155" class="t">Elevated seat</text><text x="886" y="154" text-anchor="end" class="s">REVIEW</text>
<rect x="600" y="180" width="300" height="40" rx="4" class="box"/><circle cx="616" cy="200" r="3.5" class="fa"/><text x="630" y="205" class="t">Critical seats</text><text x="886" y="204" text-anchor="end" class="s">AUDIT · AUDIT_2</text>
