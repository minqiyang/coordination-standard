<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" width="940" height="396" role="img" aria-labelledby="t d">
<title id="t">System overview</title>
<desc id="d">The owner gives the coordinator goals and approvals, and the coordinator tells the owner only when all the work is done or when it is stuck. The coordinator is any agent CLI in its own Herdr Tab. It follows the rules (coordinator.md) and the model bindings (model_bindings.json), and it dispatches cards by route to workers out of the owner's sidebar. Producers (GENERAL_EXEC, EXPERT) write the code. Model 1 review covers the AUDIT_2 seat and the ADJUDICATOR. Model 2 review covers the REVIEW and AUDIT seats. Workers run in Tabs of a separate Herdr session; a headless seat, such as codex exec, has no Tab. Each worker has its own git worktree, and seats are read-only at the frozen SHA. Every worker writes its report to the coord directory outside the repository, which also holds tasks.md. The coordinator reads and verifies the reports. Subagents are read-only helpers.</desc>
<style>
  svg{--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--accent:#D97757;--paper:#ffffff}
  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .k{font-size:11px;letter-spacing:.08em;fill:var(--mute)}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;fill:var(--mute)}
  .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .ink{fill:none;stroke:var(--ink);stroke-width:1.5}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .fa{fill:var(--accent)} .fi{fill:var(--ink)} .fm{fill:var(--mute)}
</style>
<defs>
