<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d">
<title id="t">Owner focus</title>
<desc id="d">The owner watches only the main Herdr sidebar, which shows the coordinator. The coordinator dispatches work to workers out of view. Producers and Opus review run in Tabs in the separate workers session. Producers include integrators, and Opus review covers Claude seats and adjudicators. GPT review seats run headless, with no Tab. Workers report back to the coordinator. The coordinator interrupts the owner only when all the work is done, or when it and its workers cannot proceed.</desc>
<style>
  svg{--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--accent:#D97757;--paper:#ffffff}
  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .k{font-size:11px;letter-spacing:.08em;fill:var(--mute)}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;fill:var(--mute)}
  .m{font-size:13px;font-weight:700}
  .w{fill:var(--paper);font-size:13px;font-weight:700}
  .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .ink{fill:none;stroke:var(--ink);stroke-width:1.5}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .fa{fill:var(--accent)} .fi{fill:var(--ink)} .fm{fill:var(--mute)} .fp{fill:var(--paper)}
</style>
<defs>
  <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fa"/></marker>
  <marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fm"/></marker>
  <marker id="ai" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fi"/></marker>
</defs>

<!-- Owner -->
<rect x="40" y="142" width="130" height="56" rx="4" class="box"/>
<text x="105" y="166" text-anchor="middle" class="t">You</text>
<text x="105" y="185" text-anchor="middle" class="s">owner</text>

<!-- The two interrupts -->
<path d="M343,156 H178" class="acc" marker-end="url(#aa)"/>
<path d="M343,184 H178" class="acc" marker-end="url(#aa)"/>
<text x="258" y="146" text-anchor="middle" class="s">all done</text>
<text x="258" y="204" text-anchor="middle" class="s">stuck</text>

<!-- Coordinator, the only agent in the main sidebar -->
<text x="400" y="92" text-anchor="middle" class="k">MAIN SIDEBAR</text>
<circle cx="400" cy="170" r="58" class="box" style="stroke-width:1.5"/>
<text x="400" y="168" text-anchor="middle" class="t">Coordinator</text>
<text x="400" y="188" text-anchor="middle" class="s">Claude Code</text>

<!-- Dispatch out of view -->
<text x="480" y="124" text-anchor="middle" class="s">dispatch</text>
<path d="M458,170 C506,170 506,114 554,114" class="acc" marker-end="url(#aa)"/>
<path d="M458,170 C506,170 506,164 554,164" class="acc" marker-end="url(#aa)"/>
<path d="M458,170 C506,170 506,246 554,246" class="acc" marker-end="url(#aa)"/>
<path d="M540,266 H400 V234" class="dash" marker-end="url(#am)"/>
<text x="470" y="256" text-anchor="middle" class="s">report</text>

<!-- Workers, out of the owner's view; names match system_architecture.svg -->
<text x="540" y="40" class="k">OUT OF VIEW</text>
<rect x="540" y="52" width="240" height="228" rx="6" class="dash"/>

<text x="560" y="80" class="k">WORKERS SESSION</text>
<rect x="560" y="94" width="200" height="40" rx="4" class="box"/><circle cx="576" cy="114" r="3.5" class="fa"/><text x="590" y="119" class="t">Producers</text>
<rect x="560" y="144" width="200" height="40" rx="4" class="box"/><circle cx="576" cy="164" r="3.5" class="fa"/><text x="590" y="169" class="t">Opus review</text>

<text x="560" y="212" class="k">HEADLESS</text>
<rect x="560" y="226" width="200" height="40" rx="4" class="box"/><circle cx="576" cy="246" r="3.5" class="fa"/><text x="590" y="251" class="t">GPT review</text>
</svg>
