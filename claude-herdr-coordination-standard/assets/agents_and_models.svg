  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .k{font-size:11px;letter-spacing:.08em;fill:var(--mute)}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;fill:var(--mute)}
  .m{font-size:13px;font-weight:700}
  .c{font-size:12px}
  .cb{font-size:12px;font-weight:700}
  .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .m1{fill:var(--paper);stroke:var(--ink);stroke-width:1.25}
  .m2{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:1.5}
  .pill{fill:var(--paper);stroke:var(--line);stroke-width:1.25}
  .fa{fill:var(--accent)}
</style>
