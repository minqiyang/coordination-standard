<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d">
<title id="t">Agents and models</title>
<desc id="d">Every role is a slot that you fill. The coordinator is any agent CLI that you start in a Herdr Tab, with the model you pick, and it starts each role. model_bindings.json gives each role a model and effort: GENERAL_EXEC writes the code (model 1, high); EXPERT takes over after 2 failures (model 1, xhigh); REVIEW reviews an important change (model 2, xhigh); AUDIT is the first review of high-risk work (model 2, xhigh); AUDIT_2 is the second review of high-risk work (model 1, xhigh); ADJUDICATOR settles a disputed finding (model 1, xhigh). Model 1 is the main model and model 2 gives a second opinion. Any of these agent CLIs can fill the coordinator or a role: Claude Code, Codex, Kimi Code, Droid, Devin, Gemini CLI, Cursor, OpenCode, Copilot CLI, Qwen Code, Amp, Kiro, Cline, or any other agent that Herdr runs. Any model that its CLI runs can fill model 1 or model 2: Claude, GPT, Gemini, Kimi, Qwen, DeepSeek, GLM, Grok, and others.</desc>
<style>
