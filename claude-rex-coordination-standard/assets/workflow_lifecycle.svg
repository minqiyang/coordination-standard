<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
<title id="t">Task flow</title>
<desc id="d">One task moves along a track from left to right: Card, Dev loop, Freeze, QA, Review, Accept, and Use. At the dev loop, an accent arrow loops back on itself, because the producer loops as often as it needs. Dashed arrows connect the dev loop with the Coordinator above it, who steps in only when the producer asks or blocks. After QA the track splits into two review branches: Own check, the coordinator's own check for a change that is easy to undo, and Reviewer, for a change whose error would be costly. The branches join again at Accept, and the track ends at Use. A dashed Repair line runs from QA and from the review back to the dev loop: a failed QA or a blocking finding sends the work back for repair.</desc>
<style>
  svg{--ink:#1f2328;--mute:#656d76;--line:#d0d7de;--accent:#D97757;--paper:#ffffff;
    --face-top:#f8f8f6;--face-bot:#e6e5e1;--panel-top:#fafaf8;--panel-bot:#f0efec;
    --edge-top:#b6b9be;--edge-bot:#7c8188;--hi:#ffffff;
    --gloss-top:#ffffff;--gloss-mid:#f3f3f1;--gloss-low:#e4e3df;--gloss-bot:#eeede9;
    --bead-top:#ffffff;--bead-bot:#d6d5d0;--rim-top:#b6b9be;--rim-bot:#7c8188;--bead-ink-top:#646a72;--bead-ink-bot:#1f2328;
    --etch-dark:rgba(31,35,40,.16);--etch-light:rgba(255,255,255,.95);
    --shadow-near:rgba(31,35,40,.22);--shadow-far:rgba(31,35,40,.12)}
  @media (prefers-color-scheme: dark){svg{--ink:#e6edf3;--mute:#8d96a0;--line:#3d444d;--accent:#D97757;--paper:#0d1117;
    --face-top:#2c323a;--face-bot:#1c2128;--panel-top:#242a31;--panel-bot:#1a1f25;
    --edge-top:#4e5660;--edge-bot:#080a0d;--hi:rgba(255,255,255,.16);
    --gloss-top:#3b424b;--gloss-mid:#31373f;--gloss-low:#252a31;--gloss-bot:#2a3037;
    --bead-top:#4a525c;--bead-bot:#1c2127;--rim-top:#8b939d;--rim-bot:#3d444d;--bead-ink-top:#f4f7fa;--bead-ink-bot:#aab2bb;
    --etch-dark:rgba(0,0,0,.6);--etch-light:rgba(255,255,255,.07);
    --shadow-near:rgba(0,0,0,.7);--shadow-far:rgba(0,0,0,.55)}}
  text{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--ink)}
  .t{font-size:14px;font-weight:700}
  .e{font-size:14px}
  .s-ft{stop-color:var(--face-top)} .s-fb{stop-color:var(--face-bot)}
  .s-pt{stop-color:var(--panel-top)} .s-pb{stop-color:var(--panel-bot)}
  .s-et{stop-color:var(--edge-top)} .s-eb{stop-color:var(--edge-bot)}
  .s-hi{stop-color:var(--hi)} .s-hi0{stop-color:var(--hi);stop-opacity:0}
  .s-g0{stop-color:var(--gloss-top)} .s-g1{stop-color:var(--gloss-mid)} .s-g2{stop-color:var(--gloss-low)} .s-g3{stop-color:var(--gloss-bot)}
  .s-bt{stop-color:var(--bead-top)} .s-bb{stop-color:var(--bead-bot)}
  .s-rt{stop-color:var(--rim-top)} .s-rb{stop-color:var(--rim-bot)}
  .s-it{stop-color:var(--bead-ink-top)} .s-ib{stop-color:var(--bead-ink-bot)}
  .s-xd{stop-color:var(--etch-dark)} .s-xl{stop-color:var(--etch-light)}
  .f-near{flood-color:var(--shadow-near)} .f-far{flood-color:var(--shadow-far)}
  .card{fill:url(#g-face);stroke:url(#g-edge);stroke-width:1.25;filter:url(#lift)}
  .panel{fill:url(#g-panel);stroke:url(#g-edge);stroke-width:1.25;filter:url(#lift)}
  .hi{fill:none;stroke:url(#g-hi);stroke-width:1}
  .etch{fill:url(#g-etch)}
  .pill{fill:url(#g-gloss);stroke:url(#g-edge);stroke-width:1.25;filter:url(#lift-sm)}
  .pill-dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .disc{fill:url(#g-face);stroke:url(#g-edge);stroke-width:1.25;filter:url(#lift)}
  .bead{fill:url(#g-bead);stroke:url(#g-rim);stroke-width:1.25;filter:url(#lift-sm)}
  .bead-fill{fill:url(#g-bead-ink);filter:url(#lift-sm)}
  .sheet{fill:url(#g-face);stroke:url(#g-edge);stroke-width:1;filter:url(#lift-sm)}
  .sheet-ln{fill:none;stroke:var(--mute);stroke-width:1}
  .ln{fill:none;stroke:var(--line);stroke-width:1.25}
  .ink{fill:none;stroke:var(--ink);stroke-width:1.25}
  .acc{fill:none;stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--mute);stroke-width:1.25;stroke-dasharray:4 4}
  .track{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
  .dashed{stroke-dasharray:4 4}
  .fa{fill:var(--accent)} .fi{fill:var(--ink)} .fm{fill:var(--mute)}
</style>
<defs>
  <linearGradient id="g-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-ft"/><stop offset="1" class="s-fb"/></linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-pt"/><stop offset="1" class="s-pb"/></linearGradient>
  <linearGradient id="g-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-et"/><stop offset="1" class="s-eb"/></linearGradient>
  <linearGradient id="g-hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-hi"/><stop offset=".4" class="s-hi0"/></linearGradient>
  <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-g0"/><stop offset=".46" class="s-g1"/><stop offset=".54" class="s-g2"/><stop offset="1" class="s-g3"/></linearGradient>
  <radialGradient id="g-bead" cx=".5" cy=".5" r=".55" fx=".5" fy=".28"><stop offset="0" class="s-bt"/><stop offset="1" class="s-bb"/></radialGradient>
  <linearGradient id="g-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-rt"/><stop offset="1" class="s-rb"/></linearGradient>
  <radialGradient id="g-bead-ink" cx=".5" cy=".5" r=".55" fx=".5" fy=".28"><stop offset="0" class="s-it"/><stop offset="1" class="s-ib"/></radialGradient>
  <linearGradient id="g-etch" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" class="s-xd"/><stop offset=".5" class="s-xl"/></linearGradient>
  <filter id="lift" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0.7"/><feOffset dy="1" result="o1"/>
    <feFlood class="f-near"/><feComposite in2="o1" operator="in" result="s1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3" result="o2"/>
    <feFlood class="f-far"/><feComposite in2="o2" operator="in" result="s2"/>
    <feMerge><feMergeNode in="s2"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lift-sm" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/><feOffset dy="0.75" result="o1"/>
    <feFlood class="f-near"/><feComposite in2="o1" operator="in" result="s1"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/><feOffset dy="1.5" result="o2"/>
    <feFlood class="f-far"/><feComposite in2="o2" operator="in" result="s2"/>
    <feMerge><feMergeNode in="s2"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fa"/></marker>
  <marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fm"/></marker>
  <marker id="ai" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0.5 L7,4 L0,7.5z" class="fi"/></marker>
</defs>
<g transform="translate(0,6)">
<!-- track -->
<path d="M60,140 H470" class="track"/>
<path d="M470,140 C495,140 495,92 520,92 H720 C745,92 745,140 770,140" class="track"/>
<path d="M470,140 C495,140 495,188 520,188 H720 C745,188 745,140 770,140" class="track"/>
<path d="M770,140 H940" class="track"/>
<!-- coordinator and dev loop -->
<text x="180" y="44" text-anchor="middle" class="t">Coordinator</text>
<path d="M172,56 V94" class="dash" marker-end="url(#am)"/>
<path d="M188,94 V56" class="dash" marker-end="url(#am)"/>
<path d="M172,133 C148,90 212,90 188,133" class="acc" marker-end="url(#aa)"/>
<!-- nodes -->
<g>
<circle cx="60" cy="140" r="7" class="bead"/><circle cx="180" cy="140" r="7" class="bead"/><circle cx="300" cy="140" r="7" class="bead"/>
<circle cx="420" cy="140" r="7" class="bead"/><circle cx="820" cy="140" r="7" class="bead"/>
</g>
<circle cx="940" cy="140" r="9" class="bead-fill"/>
<g text-anchor="middle">
<text x="60" y="170" class="t">Card</text>
<text x="180" y="170" class="t">Dev loop</text>
<text x="300" y="170" class="t">Freeze</text>
<text x="420" y="170" class="t">QA</text>
<text x="620" y="145" class="t">Review</text>
<text x="820" y="170" class="t">Accept</text>
<text x="940" y="170" class="t">Use</text>
<text x="620" y="80" class="e">Own check</text>
<text x="620" y="211" class="e">Reviewer</text>
</g>
<!-- repair -->
<path d="M420,182 V244 M710,200 V244" class="dash"/>
<path d="M710,244 H180 V182" class="dash" marker-end="url(#am)"/>
<text x="300" y="236" text-anchor="middle" class="e">Repair</text>
</g>
</svg>
